apiVersion: v1
kind: Namespace
metadata:
  name: certificates
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager
  namespace: certificates
data:
  (parse_yaml("config.yaml")):
    clusterResourceNamespace: certificates
    leaderElectionConfig:
      namespace: certificates
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cert-manager-cainjector
  namespace: certificates
data:
  (parse_yaml("config.yaml")):
    leaderElectionConfig:
      namespace: certificates
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook
  namespace: certificates
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager:leaderelection
  namespace: certificates
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: certificates
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-controller-certificates
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: certificates
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cert-manager-webhook
  annotations:
    cert-manager.io/inject-ca-from-secret: certificates/cert-manager-webhook-ca
webhooks:
- clientConfig:
    service:
      name: cert-manager-webhook
      namespace: certificates
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: cert-manager-webhook
  annotations:
    cert-manager.io/inject-ca-from-secret: certificates/cert-manager-webhook-ca
webhooks:
- clientConfig:
    service:
      namespace: certificates
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kadras-root-ca
  namespace: certificates
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: certificates
