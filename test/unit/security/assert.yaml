apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  (ingress == null): true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-webhook-allow-api-server
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
  ingress:
  - ports:
    - protocol: TCP
      port: 10250
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-allow-metrics
  namespace: cert-manager
spec:
  ingress:
  - ports:
    - protocol: TCP
      port: 9402
