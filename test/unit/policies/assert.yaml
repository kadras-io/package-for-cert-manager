apiVersion: policies.kyverno.io/v1
kind: NamespacedImageValidatingPolicy
metadata:
  name: cert-manager-verify-image
  namespace: cert-manager
spec:
  validationActions:
  - Deny
  matchImageReferences:
  - glob: quay.io/jetstack/cert-manager*
  attestors:
  - name: cosign
    cosign:
      key:
        (starts_with(data, '-----BEGIN PUBLIC KEY-----')): true
        hashAlgorithm: sha512
