#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/cert_manager.star", "webhook_secure_port")

#! =============================================
#! Pod Security Standards
#! =============================================

#! The workloads comply with the "restricted" Pod Security Standard, enforced on the package namespace.
#! The ACME HTTP-01 solver Pods run in the namespaces of the Certificates, so they're not affected.
#! See: https://kubernetes.io/docs/concepts/security/pod-security-standards/

#@overlay/match by=overlay.subset({"kind":"Namespace"})
---
metadata:
  #@overlay/match missing_ok=True
  labels:
    #@overlay/match missing_ok=True
    pod-security.kubernetes.io/enforce: restricted
    #@overlay/match missing_ok=True
    pod-security.kubernetes.io/audit: restricted
    #@overlay/match missing_ok=True
    pod-security.kubernetes.io/warn: restricted

#! =============================================
#! Service Account Tokens
#! =============================================

#! The service account tokens aren't auto-mounted. Instead, each container mounts a projected token
#! with a short expiration, which the kubelet rotates.
#! See: https://cert-manager.io/docs/installation/best-practice/#restrict-auto-mount-of-service-account-tokens

#@overlay/match by=overlay.subset({"kind":"ServiceAccount"}), expects=3
---
automountServiceAccountToken: false

#@overlay/match by=overlay.subset({"kind":"Deployment"}), expects=3
---
spec:
  template:
    #@overlay/match-child-defaults missing_ok=True
    spec:
      automountServiceAccountToken: false
      containers:
        #@overlay/match by=overlay.all
        - volumeMounts:
            - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              name: serviceaccount-token
              readOnly: true
      volumes:
        - name: serviceaccount-token
          projected:
            defaultMode: 0444
            sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                - key: ca.crt
                  path: ca.crt
            - downwardAPI:
                items:
                - path: namespace
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace

#! =============================================
#! Network Policies
#! =============================================

#! Deny the inbound traffic to the cert-manager Pods, except for the admission requests to the webhook,
#! sent by the Kubernetes API server, and the metrics scraping. The source of both isn't known in advance,
#! so they're allowed from anywhere: restrict them with a ytt overlay. The traffic from the kubelet,
#! like health probes, is always allowed. The outbound traffic isn't restricted, since the controller
#! reaches the ACME servers and the DNS providers.
#! See: https://cert-manager.io/docs/installation/best-practice/#network-requirements-and-network-policy

#@ if data.values.security.network_policies:
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-default-deny-ingress
  namespace: #@ data.values.namespace
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-allow-metrics
  namespace: #@ data.values.namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 9402

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-webhook-allow-api-server
  namespace: #@ data.values.namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/component: webhook
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: #@ webhook_secure_port()
#@ end
