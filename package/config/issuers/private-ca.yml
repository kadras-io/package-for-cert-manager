#@ load("@ytt:data", "data")

#! A private CA: a self-signed root certificate, used by the `kadras-ca-issuer` ClusterIssuer to sign certificates.
#! The root certificate is renewed by cert-manager, but the certificates it signed aren't re-issued:
#! they keep their validity until their own renewal. Trust in the CA can be distributed with trust-manager.
#! See: https://cert-manager.io/docs/configuration/ca/

#@ private_ca = data.values.issuers.private_ca

#@ if private_ca.enabled:

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kadras-bootstrap-issuer
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kadras-root-ca
  namespace: #@ data.values.namespace
spec:
  isCA: true
  commonName: kadras
  secretName: kadras-root-ca
  duration: #@ private_ca.duration
  renewBefore: #@ private_ca.renew_before
  subject:
    organizations:
    - kadras
  privateKey:
    algorithm: Ed25519
    encoding: PKCS8
  issuerRef:
    name: kadras-bootstrap-issuer
    kind: ClusterIssuer
    group: cert-manager.io

#! ClusterIssuers read their Secrets from the cluster resource namespace, which is the package namespace.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kadras-ca-issuer
spec:
  ca:
    secretName: kadras-root-ca

#@ end
