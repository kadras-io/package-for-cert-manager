#@ load("@ytt:data", "data")
#@ load("/lib/cert_manager.star", "sync_dns01_credentials")

#! ClusterIssuers read their Secrets from the package namespace. When the Secret with the DNS-01 credentials
#! is in another namespace, secretgen-controller syncs it into the package namespace.
#! See: https://github.com/carvel-dev/secretgen-controller/blob/develop/docs/secret-export.md

#@ credentials = data.values.issuers.letsencrypt.dns01.credentials

#@ if sync_dns01_credentials():
---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretExport
metadata:
  name: #@ credentials.secret
  namespace: #@ credentials.namespace
spec:
  toNamespaces:
  - #@ data.values.namespace

---
apiVersion: secretgen.carvel.dev/v1alpha1
kind: SecretImport
metadata:
  name: #@ credentials.secret
  namespace: #@ data.values.namespace
spec:
  fromNamespace: #@ credentials.namespace
#@ end
