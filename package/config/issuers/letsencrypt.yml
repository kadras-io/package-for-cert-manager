#@ load("@ytt:data", "data")
#@ load("/lib/cert_manager.star", "letsencrypt_environment", "letsencrypt_solver")

#! A ClusterIssuer for Let's Encrypt, solving either HTTP-01 or DNS-01 challenges.
#! See: https://cert-manager.io/docs/configuration/acme/

#@ letsencrypt = data.values.issuers.letsencrypt
#@ environment = letsencrypt_environment()

#@ if letsencrypt.enabled:
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: #@ environment.issuer
spec:
  acme:
    server: #@ environment.server
    #@ if/end letsencrypt.email:
    email: #@ letsencrypt.email
    privateKeySecretRef:
      name: #@ environment.account_secret
    solvers:
    - #@ letsencrypt_solver()
#@ end
